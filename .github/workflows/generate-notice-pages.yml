name: Generate static notice pages

on:
  push:
    paths:
      - notice.xml
      - scripts/generate_notice_pages.py
      - .github/workflows/generate-notice-pages.yml
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render notice pages from notice.xml
        run: python scripts/generate_notice_pages.py
      - name: Commit regenerated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notices sitemap.xml
          if git diff --cached --quiet; then
            echo "No notice changes."
          else
            git commit -m "Regenerate static notice pages from notice.xml"
            git push
          fi
